<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<title>Bronnenboek</title>
<meta name="viewport" content="width=1280" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg:           oklch(0.158 0.004 70);
    --bg-2:         oklch(0.192 0.005 70);
    --surface:      oklch(0.222 0.005 70);
    --surface-2:    oklch(0.255 0.005 70);
    --hover:        oklch(0.275 0.006 70);
    --border:       oklch(0.305 0.006 70);
    --border-2:     oklch(0.380 0.008 70);
    --rule:         oklch(0.250 0.005 70);

    --text:         oklch(0.965 0.003 85);
    --text-2:       oklch(0.820 0.006 80);
    --muted:        oklch(0.640 0.010 75);
    --dim:          oklch(0.480 0.010 75);

    --accent:       oklch(0.790 0.150 75);
    --accent-ink:   oklch(0.20 0.05 70);
    --accent-soft:  oklch(0.790 0.150 75 / 0.14);

    --green:        oklch(0.760 0.150 148);
    --green-soft:   oklch(0.760 0.150 148 / 0.16);
    --red:          oklch(0.680 0.205 25);
    --red-soft:     oklch(0.680 0.205 25 / 0.16);
    --orange:       oklch(0.740 0.180 52);
    --orange-soft:  oklch(0.740 0.180 52 / 0.18);
    --grayb:        oklch(0.560 0.010 75);
    --grayb-soft:   oklch(0.560 0.010 75 / 0.18);
    --mark:         oklch(0.840 0.160 88);
    --mark-soft:    oklch(0.840 0.160 88 / 0.28);

    --r-1: 3px;
    --r-2: 5px;
    --r-3: 8px;

    --font-ui:   "Inter", system-ui, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-serif: "Source Serif 4", "Georgia", serif;
  }

  [data-accent="blue"] {
    --accent:      oklch(0.720 0.100 248);
    --accent-ink:  oklch(0.18 0.04 248);
    --accent-soft: oklch(0.720 0.100 248 / 0.16);
  }

  html, body, #root {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    font-feature-settings: "ss01", "cv11";
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent-soft); color: var(--text); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(0.32 0.005 70); border-radius: 3px; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
        integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
        integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
        integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
        crossorigin="anonymous"></script>

<script type="text/babel" src="/js/shared.jsx"></script>
<script type="text/babel" src="/js/dashboard.jsx"></script>
<script type="text/babel" src="/js/scrape.jsx"></script>
<script type="text/babel" src="/js/search.jsx"></script>
<script type="text/babel" src="/js/app.jsx"></script>
</head>
<body>
<div id="root"></div>
</body>
</html>
